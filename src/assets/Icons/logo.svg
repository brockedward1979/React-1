<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .bg { fill: transparent; }
      .outer { fill: lightgrey; stroke: #orange; stroke-width: 8; }
      .inner { fill: orange; stroke: #ffffff; stroke-width: 2; }
      .curved-text { font-family: 'Inter', sans-serif; font-size: 40px; font-weight: 600; letter-spacing: 2px; fill: grey; }
      .wordmark { font-family: 'Poppins', sans-serif; font-size: 80px; font-weight: 900; fill: #orange; }
    </style>

    <!-- Glow gradient -->
    <radialGradient id="rectGlow" cx="50%" cy="50%" r="100%">
      <stop offset="70%" stop-color="#c69c4f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c69c4f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="100%" height="100%"/>

  <!-- Glow rectangle (nur tashqi ramkadan boshlanadi) -->
  <!-- <rect x="20" y="20" width="760" height="200" fill="url(#rectGlow)"/> -->

 

  <!-- Outer golden rectangle -->
  <rect x="20" y="150" width="760" height="100" class="outer"/>

  <!-- Inner dark rectangle -->
  <rect x="200" y="140" width="400" height="120" class="inner"/>

  <!-- Top text -->
  <!-- <text x="400" y="60" text-anchor="middle" class="curved-text">
    BU SAYT QARINDOSHLAR UCHUN
  </text> -->

  <!-- Bottom text -->
  <text x="400" y="360" text-anchor="middle" class="curved-text">
    ESTABLISHED IN 2025
  </text>

  <!-- Central wordmark -->
  <text x="400" y="230" text-anchor="middle" class="wordmark">
    QARINDOSH
  </text>
</svg>
